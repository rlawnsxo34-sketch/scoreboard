<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다중 팀 스코어보드 & 타이머</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap');

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .display-font {
            font-family: 'Black Han Sans', sans-serif;
        }

        .score-input {
            font-family: 'Black Han Sans', sans-serif;
            background: transparent;
            border: none;
            outline: none;
            text-align: center;
            width: 100%;
            transition: all 0.15s ease-out;
            -moz-appearance: textfield;
            line-height: 1;
        }

        .score-input::-webkit-outer-spin-button,
        .score-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .push-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 0 transparent !important;
        }

        /* 모바일 환경 안정성: 버튼 더블탭 줌 방지 */
        button {
            touch-action: manipulation;
        }

        #scoreboard-container {
            transition: all 0.3s ease;
        }

        /* 팀 카드 상단 헤더 색상 영역 */
        .team-header {
            width: 100%;
            padding: 0.5rem 0;
            text-align: center;
            border-top-left-radius: 1.5rem; /* 카드 둥근 모서리와 맞춤 */
            border-top-right-radius: 1.5rem;
            opacity: 0.9;
        }

        /* 타이머 관련 스타일 */
        .timer-input {
            background: transparent;
            border: none;
            outline: none;
            text-align: center;
            width: 2.5ch;
            -moz-appearance: textfield;
        }
        .timer-input::-webkit-outer-spin-button,
        .timer-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        .timer-blink {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; color: #ef4444; }
            50% { opacity: 0.5; color: #f87171; }
        }

        /* 플로팅 텍스트 애니메이션 */
        .floating-text {
            position: absolute;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 50;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }
    </style>
    <!-- Canvas Confetti 라이브러리 (꽃가루 효과용) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="p-2 md:p-4 pt-[160px] sm:pt-[170px] md:pt-[120px] h-[100dvh] overflow-y-auto md:overflow-hidden flex flex-col overscroll-none">

    <!-- 오디오 엘리먼트 (효과음) -->
    <audio id="sound-coin" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" preload="auto"></audio>
    <audio id="sound-end" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <audio id="sound-win" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3" preload="auto"></audio>

    <!-- 토스트 메시지 -->
    <div id="toast" class="fixed top-32 left-1/2 -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-full shadow-lg transform -translate-y-20 opacity-0 transition-all duration-300 z-[60] pointer-events-none font-bold text-center w-[90%] md:w-auto max-w-md break-keep">
        메시지
    </div>

    <!-- 상단 컨트롤 패널 & 타이머 -->
    <div class="fixed top-0 left-0 w-full z-50 bg-[#0f172a] border-b border-gray-800 shadow-xl flex flex-col md:flex-row items-center justify-between p-2 md:p-4 gap-2 md:gap-4">
        <!-- 왼쪽: 팀 관리 및 종료 -->
        <div class="flex items-center gap-1 sm:gap-2 order-2 md:order-1 w-full md:w-auto justify-center">
            <button onclick="removeTeam()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 py-1.5 px-3 md:py-2 md:px-4 rounded-full font-bold shadow-lg border border-gray-600 transition-colors flex items-center gap-1 text-xs sm:text-sm md:text-base">
                <span class="text-base md:text-lg leading-none">-</span> 팀
            </button>
            <button onclick="addTeam()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 py-1.5 px-3 md:py-2 md:px-4 rounded-full font-bold shadow-lg border border-gray-600 transition-colors flex items-center gap-1 text-xs sm:text-sm md:text-base">
                <span class="text-base md:text-lg leading-none">+</span> 팀
            </button>
            <button onclick="resetScores()" class="bg-slate-700 hover:bg-slate-600 text-white py-1.5 px-3 sm:px-4 md:py-2 md:px-4 rounded-full font-bold shadow-lg border border-slate-500 transition-colors text-xs sm:text-sm md:text-base ml-1 sm:ml-2">
                리셋
            </button>
            <button onclick="finishGame()" class="bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-400 hover:to-yellow-500 text-white py-1.5 px-3 sm:px-4 md:py-2 md:px-5 rounded-full font-bold shadow-lg border border-yellow-700 transition-colors text-xs sm:text-sm md:text-base ml-1 sm:ml-2">
                🏆 종료
            </button>
        </div>

        <!-- 중앙: 타이머 및 퀵버튼 -->
        <div class="flex flex-col sm:flex-row items-center gap-2 sm:gap-3 bg-gray-900 px-3 sm:px-4 md:px-6 py-1.5 sm:py-2 rounded-2xl border border-gray-700 order-1 md:order-2 w-full md:w-auto justify-center">
            <!-- 퀵버튼 영역 -->
            <div class="flex gap-1 mb-1 sm:mb-0 sm:mr-2">
                <button onclick="addTime(60)" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-2 py-1 rounded text-xs font-bold">+1분</button>
                <button onclick="addTime(30)" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-2 py-1 rounded text-xs font-bold">+30초</button>
                <button onclick="addTime(10)" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-2 py-1 rounded text-xs font-bold">+10초</button>
                <button onclick="addTime(-10)" class="bg-gray-800 hover:bg-gray-700 text-red-400 px-2 py-1 rounded text-xs font-bold">-10초</button>
            </div>
            
            <div id="timer-display" class="display-font text-3xl sm:text-4xl md:text-5xl text-yellow-400 flex items-center tracking-wider transition-colors">
                <input type="number" id="timer-min" value="05" class="timer-input text-yellow-400 focus:bg-gray-800 focus:rounded" onclick="this.select()" onchange="formatTimerInput(this)" onblur="formatTimerInput(this)">
                <span class="mx-0.5 sm:mx-1 pb-1">:</span>
                <input type="number" id="timer-sec" value="00" class="timer-input text-yellow-400 focus:bg-gray-800 focus:rounded" onclick="this.select()" onchange="formatTimerInput(this, true)" onblur="formatTimerInput(this, true)">
            </div>
            <div class="flex gap-1 sm:gap-2 ml-1 sm:ml-2">
                <button id="timer-toggle-btn" onclick="toggleTimer()" class="w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 bg-yellow-600 hover:bg-yellow-500 rounded-full flex items-center justify-center text-white shadow-lg transition-colors">
                    <!-- Play 아이콘 -->
                    <svg id="icon-play" class="w-4 h-4 sm:w-5 sm:h-5 md:w-6 md:h-6 ml-1" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"></path></svg>
                    <!-- Pause 아이콘 (기본 숨김) -->
                    <svg id="icon-pause" class="w-4 h-4 sm:w-5 sm:h-5 md:w-6 md:h-6 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M5 4h3v12H5V4zm7 0h3v12h-3V4z"></path></svg>
                </button>
                <button onclick="resetTimer()" class="w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 bg-gray-700 hover:bg-gray-600 rounded-full flex items-center justify-center text-white shadow-lg transition-colors">
                    <!-- Stop/Reset 아이콘 -->
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 md:w-6 md:h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"></path></svg>
                </button>
            </div>
        </div>

        <!-- 오른쪽: 빈 공간 (균형용) -->
        <div class="hidden md:block w-[200px] order-3"></div>
    </div>

    <!-- 스코어보드 메인 영역 (배율 및 오버플로우 안정성 개선) -->
    <div id="scoreboard-container" class="flex-1 w-full max-w-[1920px] mx-auto h-full grid gap-3 md:gap-6 auto-rows-fr grid-cols-1 md:grid-cols-2 pb-4">
        <!-- JS로 렌더링 -->
    </div>

    <script>
        // --- 타이머 로직 ---
        let timerInterval = null;
        let isTimerRunning = false;
        let initialTime = { min: 5, sec: 0 }; // 리셋용 저장값

        // 효과음 함수
        function playSound(id) {
            const sound = document.getElementById(id);
            if(sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log('Audio play failed:', e));
            }
        }

        const elMin = document.getElementById('timer-min');
        const elSec = document.getElementById('timer-sec');
        const displayContainer = document.getElementById('timer-display');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const toggleBtn = document.getElementById('timer-toggle-btn');

        // 입력값 포맷팅 (05, 00 형태로)
        function formatTimerInput(element, isSeconds = false) {
            let val = parseInt(element.value, 10);
            if (isNaN(val) || val < 0) val = 0;
            if (isSeconds && val > 59) val = 59;
            element.value = val.toString().padStart(2, '0');
            
            if (!isTimerRunning) {
                initialTime.min = parseInt(elMin.value, 10);
                initialTime.sec = parseInt(elSec.value, 10);
            }
        }

        // 타이머 퀵-버튼 기능 (+1분, +30초 등)
        function addTime(secondsToAdd) {
            let m = parseInt(elMin.value, 10) || 0;
            let s = parseInt(elSec.value, 10) || 0;
            let totalSeconds = m * 60 + s + secondsToAdd;

            if (totalSeconds < 0) totalSeconds = 0;

            let rm = Math.floor(totalSeconds / 60);
            let rs = totalSeconds % 60;
            
            elMin.value = rm.toString().padStart(2, '0');
            elSec.value = rs.toString().padStart(2, '0');
            
            if (!isTimerRunning) {
                initialTime.min = rm;
                initialTime.sec = rs;
            }
        }

        function toggleTimer() {
            if (isTimerRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            let m = parseInt(elMin.value, 10);
            let s = parseInt(elSec.value, 10);
            let totalSeconds = m * 60 + s;

            if (totalSeconds <= 0) return;

            // 안정성: 타이머 중복 실행을 막기 위해 기존 인터벌 확실히 정리
            clearInterval(timerInterval);

            isTimerRunning = true;
            elMin.disabled = true;
            elSec.disabled = true;
            
            // 아이콘 변경 및 색상 복구
            iconPlay.classList.add('hidden');
            iconPause.classList.remove('hidden');
            toggleBtn.classList.replace('bg-yellow-600', 'bg-red-600');
            toggleBtn.classList.replace('hover:bg-yellow-500', 'hover:bg-red-500');
            displayContainer.classList.remove('timer-blink');
            elMin.classList.remove('text-red-500');
            elSec.classList.remove('text-red-500');
            elMin.classList.add('text-yellow-400');
            elSec.classList.add('text-yellow-400');

            timerInterval = setInterval(() => {
                totalSeconds--;
                
                let rm = Math.floor(totalSeconds / 60);
                let rs = totalSeconds % 60;
                
                elMin.value = rm.toString().padStart(2, '0');
                elSec.value = rs.toString().padStart(2, '0');

                if (totalSeconds <= 0) {
                    timerFinished();
                }
            }, 1000);
        }

        function pauseTimer() {
            isTimerRunning = false;
            clearInterval(timerInterval);
            elMin.disabled = false;
            elSec.disabled = false;
            
            // 아이콘 변경
            iconPause.classList.add('hidden');
            iconPlay.classList.remove('hidden');
            toggleBtn.classList.replace('bg-red-600', 'bg-yellow-600');
            toggleBtn.classList.replace('hover:bg-red-500', 'hover:bg-yellow-500');
        }

        function resetTimer() {
            pauseTimer();
            elMin.value = initialTime.min.toString().padStart(2, '0');
            elSec.value = initialTime.sec.toString().padStart(2, '0');
            displayContainer.classList.remove('timer-blink');
            elMin.classList.replace('text-red-500', 'text-yellow-400');
            elSec.classList.replace('text-red-500', 'text-yellow-400');
        }

        function timerFinished() {
            pauseTimer();
            displayContainer.classList.add('timer-blink');
            elMin.classList.replace('text-yellow-400', 'text-red-500');
            elSec.classList.replace('text-yellow-400', 'text-red-500');
            playSound('sound-end');
            showToast('시간이 종료되었습니다!');
        }

        // --- 기존 스코어보드 & 데이터 저장 로직 ---
        const palettes = [
            { hex: '#ef4444', darkHex: '#991b1b', bgHex: 'rgba(239, 68, 68, 0.05)' },
            { hex: '#3b82f6', darkHex: '#1e40af', bgHex: 'rgba(59, 130, 246, 0.05)' },
            { hex: '#22c55e', darkHex: '#166534', bgHex: 'rgba(34, 197, 94, 0.05)' },
            { hex: '#eab308', darkHex: '#854d0e', bgHex: 'rgba(234, 179, 8, 0.05)' },
            { hex: '#a855f7', darkHex: '#6b21a8', bgHex: 'rgba(168, 85, 247, 0.05)' },
            { hex: '#f97316', darkHex: '#9a3412', bgHex: 'rgba(249, 115, 22, 0.05)' },
            { hex: '#ec4899', darkHex: '#9d174d', bgHex: 'rgba(236, 72, 153, 0.05)' },
            { hex: '#06b6d4', darkHex: '#155e75', bgHex: 'rgba(6, 182, 212, 0.05)' }
        ];

        // 로컬 스토리지에서 데이터 불러오기 또는 기본값 설정
        let teams = JSON.parse(localStorage.getItem('scoreboard_teams')) || [
            { id: 1, name: '포이팀', score: 0 },
            { id: 2, name: '마리팀', score: 0 }
        ];

        // ID 중복 방지를 위한 nextTeamId 계산
        let nextTeamId = teams.length > 0 ? Math.max(...teams.map(t => t.id)) + 1 : 3;
        
        let toastTimeout = null;

        // 데이터 자동 저장 함수
        function saveTeamsToStorage() {
            localStorage.setItem('scoreboard_teams', JSON.stringify(teams));
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            // 안정성: 기존 타이머가 있으면 취소 후 다시 세팅하여 연속 클릭 대응
            if (toastTimeout) clearTimeout(toastTimeout);
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 2500);
        }

        // 게임 종료 및 축하 효과
        function finishGame() {
            if(teams.length === 0) return;
            
            // 최고 점수 찾기
            const maxScore = Math.max(...teams.map(t => t.score));
            const winners = teams.filter(t => t.score === maxScore);
            
            if(maxScore === 0) {
                showToast('아직 점수가 없습니다!');
                return;
            }

            playSound('sound-win');
            
            // 승리팀 이름 조합
            const winnerNames = winners.map(w => w.name).join(', ');
            showToast(`🎉 ${winnerNames} 우승! 🎉`);

            // 화려한 꽃가루(Confetti) 이펙트 발동
            var duration = 3000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function renderTeams() {
            const container = document.getElementById('scoreboard-container');
            container.innerHTML = '';

            const isDense = teams.length > 4;

            // 모바일 환경에서도 그리드가 너무 길어지지 않게 유지, 모바일(sm) 화면에서도 다수 팀 2단 배치 허용
            let gridClasses = "flex-1 w-full max-w-[1920px] mx-auto h-full grid gap-3 md:gap-6 auto-rows-fr pb-4 ";
            if (teams.length === 1) gridClasses += "grid-cols-1";
            else if (teams.length === 2) gridClasses += "grid-cols-1 md:grid-cols-2";
            else if (teams.length === 3) gridClasses += "grid-cols-1 md:grid-cols-3";
            else if (teams.length === 4) gridClasses += "grid-cols-1 md:grid-cols-2 lg:grid-cols-4";
            else if (teams.length <= 6) gridClasses += "grid-cols-1 sm:grid-cols-2 lg:grid-cols-3";
            else gridClasses += "grid-cols-1 sm:grid-cols-2 lg:grid-cols-4";
            
            container.className = gridClasses;

            teams.forEach((team, index) => {
                const p = palettes[index % palettes.length];
                const defaultName = index === 0 ? '포이팀' : (index === 1 ? '마리팀' : `팀 ${index + 1}`);

                // 모바일 해상도에서 버튼 텍스트가 깨지거나 점수가 너무 거대해지는 현상 방지
                const cardPadding = isDense ? 'p-2 md:p-3' : 'p-3 md:p-6';
                const nameSize = isDense ? 'text-2xl md:text-3xl lg:text-4xl' : 'text-3xl sm:text-4xl md:text-5xl lg:text-6xl';
                const scoreSize = isDense ? 'text-[4rem] sm:text-[3.5rem] lg:text-[5.5rem]' : 'text-[6rem] sm:text-[5rem] md:text-[8rem] lg:text-[11rem]';
                const pyButton = isDense ? 'py-1.5 md:py-2' : 'py-2 sm:py-3 md:py-4';
                const btnText = isDense ? 'text-sm sm:text-base md:text-lg lg:text-xl' : 'text-lg sm:text-2xl md:text-3xl';
                const minusPy = isDense ? 'py-1' : 'py-1.5 md:py-2';
                const minusText = isDense ? 'text-xs md:text-sm' : 'text-sm sm:text-base md:text-xl';
                const myMargin = isDense ? 'my-0' : 'my-1 md:my-2';

                // 내부 패딩을 조정하여 헤더 영역 확보, 모바일에서 카드가 찌그러지지 않도록 min-h-[200px] 보장
                const cardHTML = `
                    <div class="flex-1 flex flex-col justify-between items-center rounded-3xl relative group shadow-2xl overflow-hidden min-h-[200px] md:min-h-[150px] border border-gray-700"
                         style="background-color: #1e293b; box-shadow: inset 0 0 100px ${p.bgHex};">
                        
                        <!-- 팀 컬러 헤더 띠 -->
                        <div class="team-header shadow-md" style="background-color: ${p.hex};"></div>

                        <div class="flex flex-col w-full h-full justify-between items-center ${cardPadding} pt-2">
                            <input type="text" value="${team.name}" 
                                   placeholder="${defaultName}"
                                   class="display-font ${nameSize} text-center bg-transparent border-b-4 border-transparent focus:outline-none w-11/12 py-1 z-10 transition-colors"
                                   style="color: ${p.hex}; border-bottom-color: rgba(255,255,255,0.05);"
                                   onfocus="this.style.borderBottomColor = '${p.hex}'"
                                   onblur="handleNameBlur(${team.id}, this, '${defaultName}')"
                                   onchange="updateTeamName(${team.id}, this.value)">

                            <div class="flex-1 flex items-center justify-center w-full z-10 ${myMargin}">
                                <input type="number" id="score-input-${team.id}" value="${team.score}"
                                       class="score-input text-white ${scoreSize}"
                                       onclick="this.select()"
                                       onblur="handleScoreBlur(${team.id}, this)"
                                       onchange="updateScoreDirect(${team.id}, this.value)">
                            </div>

                            <div class="w-full max-w-sm flex flex-col gap-1 md:gap-2 z-10 shrink-0 relative">
                                <div class="flex gap-1 md:gap-2 w-full">
                                    <button onclick="modifyScore(${team.id}, 1, event)" class="push-btn flex-1 text-white ${pyButton} ${btnText} whitespace-nowrap font-bold rounded-lg md:rounded-xl transition-all relative overflow-hidden" style="background-color: ${p.hex}; box-shadow: 0 4px 0 ${p.darkHex}">+1</button>
                                    <button onclick="modifyScore(${team.id}, 10, event)" class="push-btn flex-1 text-white ${pyButton} ${btnText} whitespace-nowrap font-bold rounded-lg md:rounded-xl transition-all relative overflow-hidden" style="background-color: ${p.hex}; box-shadow: 0 4px 0 ${p.darkHex}">+10</button>
                                    <button onclick="modifyScore(${team.id}, 100, event)" class="push-btn flex-1 text-white ${pyButton} ${btnText} whitespace-nowrap font-bold rounded-lg md:rounded-xl transition-all relative overflow-hidden" style="background-color: ${p.hex}; box-shadow: 0 4px 0 ${p.darkHex}">+100</button>
                                </div>
                                <div class="flex gap-1 md:gap-2 w-full opacity-40 hover:opacity-100 transition-opacity">
                                    <button onclick="modifyScore(${team.id}, -1, event)" class="push-btn flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 ${minusPy} ${minusText} whitespace-nowrap font-bold rounded-md md:rounded-lg shadow-[0_3px_0_rgb(51,65,85)] relative overflow-hidden">-1</button>
                                    <button onclick="modifyScore(${team.id}, -10, event)" class="push-btn flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 ${minusPy} ${minusText} whitespace-nowrap font-bold rounded-md md:rounded-lg shadow-[0_3px_0_rgb(51,65,85)] relative overflow-hidden">-10</button>
                                    <button onclick="modifyScore(${team.id}, -100, event)" class="push-btn flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 ${minusPy} ${minusText} whitespace-nowrap font-bold rounded-md md:rounded-lg shadow-[0_3px_0_rgb(51,65,85)] relative overflow-hidden">-100</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // 플로팅 텍스트 애니메이션 생성 함수
        function createFloatingText(buttonElement, text, isPositive) {
            const rect = buttonElement.getBoundingClientRect();
            const floatEl = document.createElement('div');
            floatEl.className = 'floating-text';
            floatEl.innerText = (isPositive ? '+' : '') + text;
            
            // 버튼 중앙 위쪽에서 시작하도록 위치 조정
            floatEl.style.left = (rect.left + rect.width / 2 - 20) + 'px';
            floatEl.style.top = (rect.top - 10) + 'px';
            
            // 양수면 초록계열, 음수면 빨강계열 색상
            floatEl.style.color = isPositive ? '#4ade80' : '#f87171';
            
            document.body.appendChild(floatEl);
            
            // 애니메이션 끝나면 DOM에서 제거
            setTimeout(() => {
                document.body.removeChild(floatEl);
            }, 800);
        }

        function modifyScore(id, amount, event) {
            const team = teams.find(t => t.id === id);
            if (team) {
                team.score += amount;
                if (team.score < 0) team.score = 0; 
                
                const inputElement = document.getElementById(`score-input-${id}`);
                inputElement.value = team.score;
                
                inputElement.style.transform = 'scale(1.1)';
                setTimeout(() => inputElement.style.transform = 'scale(1)', 150);

                // 효과음 및 플로팅 텍스트 실행
                if (amount > 0) playSound('sound-coin');
                
                // 이벤트 객체가 있으면 플로팅 애니메이션 띄우기
                if (event && event.currentTarget) {
                    createFloatingText(event.currentTarget, amount, amount > 0);
                }

                saveTeamsToStorage(); // 변경사항 저장
            }
        }

        function updateScoreDirect(id, value) {
            const team = teams.find(t => t.id === id);
            let parsed = parseInt(value, 10);
            if (isNaN(parsed)) parsed = 0;
            if (parsed < 0) parsed = 0;
            
            if (team) {
                team.score = parsed;
                document.getElementById(`score-input-${id}`).value = team.score;
                saveTeamsToStorage(); // 변경사항 저장
            }
        }

        function handleScoreBlur(id, inputElement) {
            if (inputElement.value.trim() === '' || isNaN(inputElement.value)) {
                updateScoreDirect(id, 0);
            }
        }

        function updateTeamName(id, value) {
            const team = teams.find(t => t.id === id);
            if (team) {
                team.name = value;
                saveTeamsToStorage(); // 변경사항 저장
            }
        }

        function addTeam() {
            if (teams.length >= 8) {
                showToast('팀은 최대 8팀까지만 추가 가능합니다.');
                return;
            }
            teams.push({ id: nextTeamId++, name: `팀 ${teams.length + 1}`, score: 0 });
            saveTeamsToStorage(); // 변경사항 저장
            renderTeams();
        }

        function removeTeam() {
            if (teams.length > 1) {
                teams.pop();
                saveTeamsToStorage(); // 변경사항 저장
                renderTeams();
            } else {
                showToast('최소 1개의 팀은 있어야 합니다.');
            }
        }

        function resetScores() {
            teams.forEach(t => t.score = 0);
            saveTeamsToStorage(); // 변경사항 저장
            renderTeams();
            showToast('점수가 리셋되었습니다.');
        }

        window.onload = renderTeams;

    </script>
</body>
</html>
